name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci.db
      NEXTAUTH_SECRET: ci-secret-0123456789abcdef0123456789
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      # Bloqueante: el build falla si aparece una vulnerabilidad alta o crítica en producción
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: |
          npx prisma db push --skip-generate
          npm run build
